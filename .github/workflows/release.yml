name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the workspace version $cargo_version in Cargo.toml." >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: if a tag's release job is re-run after a partial
          # failure, a crate already published at this version is treated
          # as success instead of failing the whole release.
          publish() {
            local pkg="$1"
            local log
            log="$(mktemp)"
            if cargo publish -p "$pkg" --locked 2>&1 | tee "$log"; then
              return 0
            fi
            if grep -q "already uploaded" "$log"; then
              echo "$pkg already published at this version, skipping."
              return 0
            fi
            return 1
          }
          publish holodeck-simctl-core
          publish holodeck-simctl-services
          publish holodeck-simctl-tui
          publish holodeck-simctl

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p holodeck-simctl --target aarch64-apple-darwin
          cargo build --release --locked -p holodeck-simctl --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/holodeck \
            target/aarch64-apple-darwin/release/holodeck \
            target/x86_64-apple-darwin/release/holodeck
          chmod +x dist/holodeck
          tar -czf "dist/holodeck-$GITHUB_REF_NAME-macos-universal.tar.gz" -C dist holodeck

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          ## Install

          ```bash
          cargo install --git https://github.com/otaviocc/Holodeck --tag TAG_PLACEHOLDER holodeck --locked
          ```

          Or download the prebuilt universal macOS binary below.

          Requires Rust 1.88+ (if building from source) and Xcode (`xcrun simctl` must be on `PATH`).
          NOTES
          sed -i '' "s/TAG_PLACEHOLDER/$GITHUB_REF_NAME/" /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "holodeck $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file /tmp/release-notes.md \
            "dist/holodeck-$GITHUB_REF_NAME-macos-universal.tar.gz"
